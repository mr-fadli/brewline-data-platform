[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brewline"
version = "1.0.0"
description = "Production-style ELT pipeline for Brewline Coffee Co. — a data engineering portfolio project"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "mr-fadli", email = "rijalfadliislamy03@gmail.com"}
]
keywords = ["data-engineering", "etl", "dbt", "airflow", "medallion-architecture"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]

dependencies = [
    "pandas>=2.0.0",
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "faker>=24.0.0",
]

[project.optional-dependencies]
gcp = [
    "google-cloud-bigquery>=3.0.0",
    "google-cloud-storage>=2.0.0",
    "google-auth>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/mr-fadli/brewline-data-platform"
Repository = "https://github.com/mr-fadli/brewline-data-platform"
Documentation = "https://github.com/mr-fadli/brewline-data-platform#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["brewline*"]
exclude = ["brewline_dbt*", "airflow*", "docs*", "generator*"]