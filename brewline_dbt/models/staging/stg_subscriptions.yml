version: 2

models:
  - name: stg_subscriptions
    columns:
      - name: subscription_id
        tests:
          - unique
          - not_null
      - name: customer_status
        tests:
          - not_null
          - accepted_values:
              values: ['is_active', 'is_paused', 'is_voluntarily_cancelled', 'is_payment_failure_cancelled']
              # deliberately excludes 'unknown_status' -- if that value
              # ever appears, this test SHOULD fail, since it means an
              # unanticipated status/reason combination showed up in bronze