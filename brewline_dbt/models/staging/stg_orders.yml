version: 2

models:
  - name: stg_orders
    description: "Unified order-level fact, combining Shopify (order grain) and Square (aggregated from line-item grain), currency-converted to USD, timezone-normalized to UTC."
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_key
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_key
      - name: channel
        tests:
          - not_null
          - accepted_values:
              values: ['retail', 'online_oneoff', 'subscription']
      - name: amount_usd
        tests:
          - not_null