version: 2

models:
  - name: fact_subscription_churn
    columns:
      - name: customer_key
        tests:
          - unique   # exactly one row per customer -- the whole point of the window function
          - not_null
      - name: churn_status
        tests:
          - not_null
          - accepted_values:
              values: ['voluntarily_churned', 'involuntarily_churned', 'not_churned']