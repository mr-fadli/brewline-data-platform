version: 2

models:
  - name: fact_customer_rfm
    columns:
      - name: customer_key
        tests:
          - unique
          - not_null
      - name: monetary_score
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5]
              quote: false
      - name: frequency_score
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5]
              quote: false
      - name: recency_score
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5]
              quote: false
      - name: tenure_bonus
        tests:
          - accepted_values:
              values: [0, 1, 2]
              quote: false