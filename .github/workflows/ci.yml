name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pipeline dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Install dbt
        run: pip install dbt-duckdb

      - name: Install pytest
        run: pip install pytest

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Generate synthetic data
        run: python generator/generate_data.py

      - name: Generate synthetic exchange_rates
        run: python generator/generate_exchange_rates.py

      - name: Run bronze ingestion (local/dev)
        run: python brewline/pipelines/bronze/ingest.py

      - name: dbt deps
        run: cd brewline_dbt && dbt deps

      - name: dbt seed
        run: cd brewline_dbt && dbt seed

      - name: dbt run
        run: cd brewline_dbt && dbt run

      - name: dbt test
        run: cd brewline_dbt && dbt test