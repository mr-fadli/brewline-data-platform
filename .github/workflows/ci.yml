name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest pytest-cov

      - name: Run Python tests
        run: pytest tests/ -v --cov=brewline --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml

  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pipeline dependencies
        run: pip install -e .

      - name: Install dbt
        run: pip install dbt-duckdb

      - name: dbt deps
        run: cd brewline_dbt && dbt deps

      - name: Generate synthetic data
        run: |
          python generator/generate_data.py
          python generator/generate_exchange_rates.py

      - name: Run bronze ingestion
        run: python -m brewline.pipelines.bronze.ingest

      - name: dbt seed
        run: cd brewline_dbt && dbt seed

      - name: dbt run
        run: cd brewline_dbt && dbt run

      - name: dbt test
        run: cd brewline_dbt && dbt test