name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install dbt-duckdb

      - name: Generate synthetic data
        run: python data_generator/generate.py

      - name: Run bronze ingestion
        run: python pipelines/bronze/ingest.py

      - name: dbt seed
        run: cd brewline_dbt && dbt seed

      - name: dbt run
        run: cd brewline_dbt && dbt run

      - name: dbt test
        run: cd brewline_dbt && dbt test